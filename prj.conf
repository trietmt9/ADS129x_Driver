# General
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024

# GPIO
CONFIG_GPIO=y

# SPI
CONFIG_SPI=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PRINTK=y

# Console/UART for debug output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Printk
CONFIG_PRINTK=y

# Optional: Float printf support (for displaying voltage values)
CONFIG_CBPRINTF_FP_SUPPORT=y
