# General
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024

# GPIO
CONFIG_GPIO=y

# SPI
CONFIG_SPI=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# (LOG_BUFFER_SIZE applies to deferred mode only; this build is immediate.)
CONFIG_LOG_PRINTK=y
# IMMEDIATE logging, not deferred. This is required here, not a preference.
#
# Deferred mode queues messages for a log thread that runs at a LOWER priority
# than main (14 vs 0). The acquisition loop busy-polls DRDY and yields with
# k_yield(), which only schedules threads of EQUAL OR HIGHER priority - so the
# log thread never runs once the loop starts, and every message after it queues
# forever. The symptom is the boot banner appearing (k_msleep during reset gave
# the log thread a window) and then nothing at all. See B-024.
#
# Immediate mode writes synchronously from the calling thread, so output cannot
# depend on scheduling. The cost is real but small here: ~0.9 ms per 80-char
# line at 921600, ten lines a second, so under 1 % of the loop's time.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y

# Console/UART for debug output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# The stock UART log backend, ON.
#
# Correct here because there is exactly one writer: main.c clocks frames out
# with uart_poll_out() from the acquisition thread, and this backend uses the
# same call from the same thread, so a log line can only ever land between
# frames.
#
# The streaming firmware (examples/main_streaming.c) cannot do this - its TX
# interrupt writes the same data register concurrently, so a log line lands
# INSIDE a frame and the host loses the block to a CRC failure. That build needs
# CONFIG_LOG_BACKEND_UART=n plus proto/src/emg_log_backend.c in target_sources.
# Setting =n WITHOUT adding that file is what produced total silence for two
# weeks - see B-023.
CONFIG_LOG_BACKEND_UART=y

# Printk
CONFIG_PRINTK=y

# Optional: Float printf support (for displaying voltage values)
CONFIG_CBPRINTF_FP_SUPPORT=y
